name: Storefront Benchmark

on:
  workflow_dispatch:
    inputs:
      pool:
        description: "Tranco rank ceiling (window is 5,000..min(pool,300,000)). Higher = more stores, slower."
        default: "25000"
      per_niche:
        description: "Max stores kept per niche"
        default: "100"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests jinja2
      - name: Run benchmark
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python storefront_discover_score.py \
            --pool ${{ github.event.inputs.pool }} \
            --per-niche ${{ github.event.inputs.per_niche }} \
            --countries UK,US \
            --workers 16 \
            --upgrade-rank-max 60000 \
            --out dashboard.html
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-benchmark
          path: |
            dashboard.html
            ranking.csv
            leads_migrate.csv
            leads_upgrade_plus.csv
          if-no-files-found: warn
